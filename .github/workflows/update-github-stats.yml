name: Update GitHub portfolio statistics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-github-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate statistics using authenticated GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function get(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            return response.json();
          }
          (async () => {
            const username = 'DveejKotiya';
            const profile = await get(`https://api.github.com/users/${username}`);
            const repositories = await get(`https://api.github.com/users/${username}/repos?per_page=100&type=owner&sort=updated`);
            const owned = repositories.filter(repo => !repo.fork);
            const stars = owned.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
            const forks = owned.reduce((sum, repo) => sum + (repo.forks_count || 0), 0);
            const languages = {};
            for (let i = 0; i < owned.length; i += 8) {
              const batch = owned.slice(i, i + 8);
              const results = await Promise.all(batch.map(repo => get(repo.languages_url)));
              for (const result of results) {
                for (const [name, bytes] of Object.entries(result)) {
                  languages[name] = (languages[name] || 0) + bytes;
                }
              }
            }
            const data = {
              updated_at: new Date().toISOString(),
              public_repos: profile.public_repos,
              followers: profile.followers,
              stars,
              forks,
              languages
            };
            fs.writeFileSync('stats.json', JSON.stringify(data, null, 2) + '\n');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit refreshed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Refresh GitHub portfolio statistics"
          git push
